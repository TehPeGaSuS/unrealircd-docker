name: Build and publish Docker image

on:
  push:
    branches: ["main"]
  schedule:
    # Check daily at 04:00 UTC for upstream commits
    - cron: "0 4 * * *"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}

    steps:
      - name: Check for upstream commits in the last 24h
        id: check
        run: |
          # On push or manual trigger, always build
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "should_build=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          SINCE=$(date -u -d '24 hours ago' '+%Y-%m-%dT%H:%M:%SZ')
          COUNT=$(curl -s \
            "https://api.github.com/repos/unrealircd/unrealircd/commits?sha=unreal60_dev&since=${SINCE}&per_page=1" \
            -H "Accept: application/vnd.github+json" \
            | python3 -c "import sys,json; print(len(json.load(sys.stdin)))")

          if [ "$COUNT" -gt "0" ]; then
            echo "Upstream has new commits — triggering build"
            echo "should_build=true" >> $GITHUB_OUTPUT
          else
            echo "No upstream commits in the last 24h — skipping build"
            echo "should_build=false" >> $GITHUB_OUTPUT
          fi

  build-and-push:
    runs-on: ubuntu-latest
    needs: check-upstream
    if: needs.check-upstream.outputs.should_build == 'true'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (for multi-platform builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=unreal60_dev
            type=schedule,pattern={{date 'YYYYMMDD'}}
            type=sha,prefix=,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,annotation-index.org.opencontainers.image.description=Docker image for UnrealIRCd tracking the unreal60_dev branch
          cache-from: type=gha
          cache-to: type=gha,mode=max

  cleanup:
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      packages: write

    steps:
      - name: Delete old package versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: unrealircd-docker
          package-type: container
          min-versions-to-keep: 5
          delete-only-untagged-versions: false
