name: Build and publish Docker image

on:
  push:
    branches: ["main"]
  schedule:
    # Check daily at 04:00 UTC for upstream commits
    - cron: "0 4 * * *"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  BRANCH: unreal60_dev

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      upstream_sha: ${{ steps.check.outputs.upstream_sha }}
      upstream_short: ${{ steps.check.outputs.upstream_short }}

    steps:
      - name: Look up the upstream tip and decide whether to build
        id: check
        run: |
          # Current tip of the tracked branch. It is passed to the build as
          # UPSTREAM_SHA so the clone layer is not served from cache, and it
          # becomes the image tag.
          # git ls-remote needs no API token and has no rate limit.
          SHA=$(git ls-remote https://github.com/unrealircd/unrealircd.git "refs/heads/${BRANCH}" | cut -f1)
          if [ -z "$SHA" ]; then
            echo "::error::Could not resolve upstream ${BRANCH}"
            exit 1
          fi
          echo "upstream_sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "upstream_short=${SHA:0:7}" >> "$GITHUB_OUTPUT"
          echo "Upstream ${BRANCH} is at $SHA"

          # On push or manual trigger, always build
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # On schedule, build only if that commit is not published yet.
          # Registry paths must be lowercase (the repo owner is mixed case).
          IMAGE="${REGISTRY}/${IMAGE_NAME,,}"
          if docker manifest inspect "${IMAGE}:${SHA:0:7}" >/dev/null 2>&1; then
            echo "Image for $SHA already published — skipping build"
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "No image for $SHA yet — triggering build"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  build-and-push:
    runs-on: ubuntu-latest
    needs: check-upstream
    if: needs.check-upstream.outputs.should_build == 'true'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ env.BRANCH }}
            type=raw,value={{date 'YYYYMMDD'}}
            type=raw,value=${{ needs.check-upstream.outputs.upstream_short }}
          labels: |
            org.opencontainers.image.revision=${{ needs.check-upstream.outputs.upstream_sha }}
            org.opencontainers.image.source=https://github.com/unrealircd/unrealircd

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            BRANCH=${{ env.BRANCH }}
            UPSTREAM_SHA=${{ needs.check-upstream.outputs.upstream_sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,annotation-index.org.opencontainers.image.description=Docker image for UnrealIRCd tracking the unreal60_dev branch
          cache-from: type=gha
          cache-to: type=gha,mode=max

  cleanup:
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      packages: write

    steps:
      - name: Delete old package versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: unrealircd-docker
          package-type: container
          min-versions-to-keep: 5
          delete-only-untagged-versions: false
