services:
  unrealircd:
    image: ghcr.io/tehpegasus/unrealircd-docker:latest
    # Or build locally:
    # build: .
    container_name: unrealircd
    restart: unless-stopped

    # Host networking: UnrealIRCd binds the host's addresses directly and
    # sees real client IPs, with no NAT and no dependency on Docker's IPv6
    # handling. Define listeners in unrealircd.conf; no "ports:" needed.
    # For the bridge alternative with published ports, see README "Networking".
    network_mode: host

    volumes:
      - ./conf:/opt/unrealircd/conf
      - ./data:/opt/unrealircd/data
      - ./logs:/opt/unrealircd/logs

    ulimits:
      nofile:
        soft: 65535
        hard: 65535

    healthcheck:
      # Asks the daemon over its control socket; exit 0 only when it answers.
      test: ["CMD", "gosu", "unrealircd", "/opt/unrealircd/unrealircd", "status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

