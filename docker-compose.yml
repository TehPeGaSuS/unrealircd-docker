services:
  unrealircd:
    image: ghcr.io/tehpegasus/unrealircd-docker:latest
    # Or build locally:
    # build: .
    container_name: unrealircd
    restart: unless-stopped

    # host networking is required so UnrealIRCd sees real client IPs.
    # Without it, all connections appear to come from the Docker gateway
    # (e.g. 172.17.0.1), which breaks IP bans, cloaking, throttling,
    # geolocation and anything else that relies on knowing where a user
    # is actually connecting from.
    # With host networking, ports are exposed directly from the host —
    # remove the ports: section and configure listeners in unrealircd.conf.
    network_mode: host

    volumes:
      - ./conf:/opt/unrealircd/conf
      - ./data:/opt/unrealircd/data
      - ./logs:/opt/unrealircd/logs
      - ./modules:/opt/unrealircd/modules/third

    ulimits:
      nofile:
        soft: 65535
        hard: 65535

    healthcheck:
      test: ["CMD-SHELL", "echo -e 'QUIT\\r' | nc -w 3 127.0.0.1 6667 | grep -qi 'irc\\|ERROR'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
